    <script>
const languageBtn = document.getElementById("languageBtn");

let english = false;

const translations = {
    es: {
        portfolioTitle: "NUESTRO TRABAJO",
        sneakers: "TODO SNEAKERS",
        paraEllos: "PARA ELLOS",
        strategy: "STRATEGY SESSION",
        matematicas: "CAMPAÑA VISUAL · DÍA DE LAS MATEMÁTICAS",
        creative: "CREATIVE ART",
        chat: "LE CHAT BAGARRE",
        skenzi: "SKENZI"
    },

    en: {
        portfolioTitle: "OUR WORK",
        sneakers: "TODO SNEAKERS",
        paraEllos: "FOR THEM",
        strategy: "STRATEGY SESSION",
        matematicas: "VISUAL CAMPAIGN · MATHEMATICS DAY",
        creative: "CREATIVE ART",
        chat: "LE CHAT BAGARRE",
        skenzi: "SKENZI"
    }
};

if (languageBtn) {
    languageBtn.addEventListener("click", function () {

        english = !english;

        const language = english ? translations.en : translations.es;

        languageBtn.textContent = english ? "ESP" : "ENG";

        document.querySelectorAll("[data-lang]").forEach(function(element) {
            const key = element.getAttribute("data-lang");

            if (language[key]) {
                element.innerHTML = language[key];
            }
        });
    });
}
  const portfolioGallery = document.querySelector('.portfolio-gallery');

if (portfolioGallery) {

    portfolioGallery.addEventListener('wheel', (e) => {
        e.preventDefault();

        portfolioGallery.scrollLeft += e.deltaY;
    }, { passive: false });


    portfolioGallery.querySelectorAll('.portfolio-item').forEach(item => {

        item.addEventListener('click', () => {

            const distancia = item.offsetWidth + 30;

            portfolioGallery.scrollBy({
                left: distancia,
                behavior: 'smooth'
            });

        });

    });

}   
 window.addEventListener("load", function () {

    const transicion = document.getElementById("renaxPageTransition");

    if (transicion) {
        setTimeout(function () {
            transicion.classList.add("hide");
        }, 900);
    }

});

document.querySelectorAll("a[href]").forEach(function (enlace) {

    enlace.addEventListener("click", function (e) {

        const destino = enlace.getAttribute("href");

        if (
            !destino ||
            destino.startsWith("#") ||
            destino.startsWith("http") ||
            destino.startsWith("mailto:")
        ) {
            return;
        }

        e.preventDefault();

        const transicion = document.getElementById("renaxPageTransition");

        if (transicion) {
            transicion.classList.remove("hide");

            setTimeout(function () {
                window.location.href = destino;
            }, 1400);
        } else {
            window.location.href = destino;
        }

});    

});     
</script>
