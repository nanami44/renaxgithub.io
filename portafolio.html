<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portafolio de proyectos - Trabajos destacados de diseño, branding y estrategia.">
  <title>Portafolio | Agencia de Branding & Marketing</title>
  
  <!-- FontAwesome v6 & CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portafolio.css?v=3">
  <style>
    /* Estilos integrados para cumplir con todos los requerimientos estéticos */
    body.portafolio-renax {
      background-color: #0b0b0b;
      background-image: url('fondo portafolio-rojo.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Fondo dinámico texturizado por encima si se requiere */
    .portafolio-fondo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: -1;
    }

    /* Transición Renax */
    .renax-page-transition {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .renax-page-transition.hide {
      opacity: 0;
      visibility: hidden;
    }
    .transition-logo-image {
      width: 150px;
      animation: pulseLogo 1.5s infinite;
    }
    @keyframes pulseLogo {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    /* Header Global */
    .site-header {
      position: sticky;
      top: 0;
      background: rgba(11, 11, 11, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 30px;
    }
    .logo-renax {
      height: 40px;
    }
    .nav-menu {
      display: flex;
      gap: 30px;
    }
    .nav-link {
      color: #bbb;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }
    .nav-link:hover, .nav-link.active {
      color: #e50914;
    }
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }
    .language {
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      padding: 5px 12px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
      transition: all 0.3s;
    }
    .language:hover {
      background: #e50914;
      border-color: #e50914;
    }
    .login-btn {
      background: #e50914;
      color: #fff;
      padding: 8px 18px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.3s;
    }
    .login-btn:hover {
      background: #b20710;
    }

    /* Hero Portafolio */
    .renax-portfolio-cover {
      width: 100%;
      text-align: center;
      padding: 60px 0 20px 0;
    }
    .renax-portfolio-cover img {
      max-width: 90%;
      height: auto;
      border-radius: 12px;
    }

    /* Carrusel de Ancho Completo sin bordes */
    .portfolio-gallery-wrapper {
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      margin-right: calc(-50vw + 50%);
      overflow-x: auto;
      padding: 30px 0;
      background: rgba(0, 0, 0, 0.4);
      scrollbar-width: none;
    }
    .portfolio-gallery-wrapper::-webkit-scrollbar {
      display: none;
    }
    .portfolio-gallery {
      display: flex;
      gap: 25px;
      padding: 0 30px;
      width: max-content;
    }
    .portfolio-item {
      position: relative;
      width: 450px;
      height: 300px;
      border-radius: 16px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .portfolio-img-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .portfolio-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .portfolio-item:hover .portfolio-img-container img {
      transform: scale(1.1);
    }
    .portfolio-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      color: #fff;
      font-weight: bold;
      font-size: 18px;
    }

    /* Secciones de Trabajos / Galerías Intercaladas */
    .renax-work-section {
      max-width: 1200px;
      margin: 80px auto;
      padding: 0 20px;
    }
    .renax-work-heading {
      text-align: center;
      margin-bottom: 50px;
    }
    .renax-work-heading span {
      color: #e50914;
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 14px;
      text-transform: uppercase;
    }
    .renax-work-heading h2 {
      font-size: 42px;
      margin-top: 10px;
      line-height: 1.2;
    }
    .renax-work-heading p {
      color: #aaa;
      max-width: 600px;
      margin: 15px auto 0 auto;
    }

    /* Layout Intercalado con imágenes centradas, bordes redondos y títulos abajo */
    .renax-work-layout {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
    }
    .renax-work-card {
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(20, 20, 20, 0.6);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .renax-work-card:hover {
      transform: translateY(-5px);
      border-color: #e50914;
    }
    .renax-work-image {
      width: 100%;
      height: 380px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    .renax-work-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }
    .renax-work-card:hover .renax-work-image img {
      transform: scale(1.1);
    }
    .renax-work-card h3 {
      font-size: 20px;
      margin: 20px 0;
      text-align: center;
      width: 100%;
      padding: 0 15px;
    }
    .renax-work-card h3 span {
      color: #e50914;
      margin-left: 5px;
    }

    /* Bloque extra grande para Diseño de Marca */
    .renax-extra-large-block {
      max-width: 1200px;
      margin: 80px auto;
      padding: 0 20px;
      text-align: center;
    }
    .renax-extra-large-card {
      display: block;
      background: rgba(20, 20, 20, 0.6);
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .renax-extra-large-card:hover {
      transform: translateY(-5px);
      border-color: #e50914;
    }
    .renax-extra-large-image {
      width: 100%;
      height: 550px;
      overflow: hidden;
    }
    .renax-extra-large-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }
    .renax-extra-large-card:hover .renax-extra-large-image img {
      transform: scale(1.05);
    }
    .renax-extra-large-card h3 {
      font-size: 28px;
      margin: 30px 0;
    }

    /* Cierre Portafolio */
    .renax-portfolio-cierre {
      text-align: center;
      padding: 100px 20px;
      background: linear-gradient(to bottom, transparent, rgba(229, 9, 20, 0.15));
    }
    .portfolio-cierre-titulo {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 30px;
      line-height: 1.1;
    }
    .portfolio-cierre-boton {
      display: inline-block;
      background: #e50914;
      color: #fff;
      padding: 16px 36px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      transition: background 0.3s, transform 0.3s;
    }
    .portfolio-cierre-boton:hover {
      background: #b20710;
      transform: scale(1.05);
    }

    /* Botones Flotantes */
    .renax-floating-buttons {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 999;
    }
    .renax-float-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.3s;
      text-decoration: none;
    }
    .renax-float-btn:hover {
      transform: scale(1.1);
    }
    .renax-whatsapp { background: #25d366; }
    .renax-facebook { background: #1877f2; }

    /* Footer Renax */
    .renax-footer {
      background: #050505;
      padding: 80px 20px 40px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .footer-wrapper {
      max-width: 1300px;
      margin: 0 auto;
    }
    .footer-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 25px;
      margin-bottom: 50px;
    }
    .footer-top-title {
      font-weight: bold;
      letter-spacing: 2px;
      color: #888;
    }
    .footer-top-link {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      transition: color 0.3s;
    }
    .footer-top-link:hover {
      color: #e50914;
    }
    .footer-columns-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 30px;
      margin-bottom: 60px;
    }
    .footer-column h3 {
      font-size: 15px;
      margin-bottom: 20px;
      color: #fff;
      letter-spacing: 1px;
    }
    .footer-menu-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .footer-menu-links a {
      color: #888;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }
    .footer-menu-links a:hover {
      color: #fff;
    }
    .footer-bottom-bar {
      text-align: center;
      padding-top: 30px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .footer-logo {
      height: 45px;
      opacity: 0.8;
    }

    @media(max-width: 900px) {
      .renax-work-layout {
        grid-template-columns: 1fr;
      }
      .footer-columns-container {
        grid-template-columns: repeat(2, 1fr);
      }
      .nav-menu {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 70px;
        left: 0;
        width: 100%;
        background: #111;
        padding: 20px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      }
      .nav-menu.open {
        display: flex;
      }
      .nav-toggle {
        display: block;
      }
    }
  </style>
</head>
<body class="portafolio-renax">

  <!-- TRANSICIÓN RENAX -->
  <div class="renax-page-transition" id="renaxPageTransition">
    <div class="renax-transition-logo">
      <img src="logo-renax-transparente.png" alt="RENAX" class="transition-logo-image">   
    </div>
  </div>

  <!-- HEADER GLOBAL -->
  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo" aria-label="Página principal">
        <img src="logo-renax-transparente.png" alt="RENAX" class="logo-renax">
      </a>

      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú de navegación">
        <i class="fa-solid fa-bars"></i>
      </button>

      <nav class="nav-menu" id="navMenu" aria-label="Navegación principal">
        <a href="index.html" class="nav-link" data-lang="navHome">Inicio</a>
        <a href="nosotros.html" class="nav-link" data-lang="navAbout">Nosotros</a>
        <a href="portafolio.html" class="nav-link active" aria-current="page" data-lang="navPortfolio">Portafolio</a>
        <a href="servicios.html" class="nav-link" data-lang="navServices">Servicios</a>
        <a href="contacto.html" class="nav-link" data-lang="navContact">Contáctanos</a>
      </nav>

      <button class="language" id="languageBtn" type="button">ENG</button>
      <a href="login.html" class="login-btn" id="navLoginBtn"><span>INICIAR SESIÓN</span></a>
    </div>
  </header>

  <!-- FONDO DINÁMICO TEXTURIZADO ROJO Y NEGRO -->
  <div class="portafolio-fondo"></div>

  <!-- MAIN CONTENT -->
  <main id="main-content">

    <!-- HERO PORTAFOLIO -->
    <section class="renax-portfolio-cover">
      <img src="portafolio-final.png" alt="PORTAFOLIO RENAX">
    </section>

    <!-- GALERÍA DE PROYECTOS (CARRUSEL DE ANCHO COMPLETO) -->
    <section class="portfolio-gallery-wrapper">
      <div class="portfolio-gallery" id="portfolioGallery">
