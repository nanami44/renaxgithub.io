<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SKENZI × RENAX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #050505;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }


        /* ==================================================
           PORTADA SKENZI
           ================================================== */

        .skenzi-hero {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 650px;
            overflow: hidden;
            background: #050505;
        }


        /* IMAGEN DE FONDO */

        .skenzi-hero-imagen {
            position: absolute;
            inset: -12%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .skenzi-hero-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;

            filter: blur(1.2px);

            transform-origin: center center;

            animation: skenziGiro 32s linear infinite;
        }


        /* GIRO CIRCULAR CONTINUO */

        @keyframes skenziGiro {

            0% {
                transform: rotate(0deg) scale(1.18);
            }

            100% {
                transform: rotate(360deg) scale(1.18);
            }

        }


        /* CAPA SUAVE PARA QUE EL CONTENIDO NO TAPE LA IMAGEN */

        .skenzi-hero-overlay {
            position: absolute;
            inset: 0;

            z-index: 5;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            pointer-events: none;
        }


        /* LOGOTIPO */

        .skenzi-hero-logo {
            width: min(280px, 32vw);
            height: auto;

            margin-bottom: 28px;

            display: block;
        }


        /* FRASE */

        .skenzi-hero-frase {
            max-width: 850px;

            padding: 0 30px;

            font-family: 'Bodoni Moda', serif;

            font-size: clamp(28px, 3.2vw, 52px);

            line-height: 1.15;

            font-weight: 400;

            color: #ffffff;

            text-shadow:
                0 2px 12px rgba(0, 0, 0, 0.75);
        }


        /* 11 AÑOS */

        .skenzi-hero-anios {
            margin-top: 22px;

            font-family: 'Montserrat', sans-serif;

            font-size: clamp(15px, 1.3vw, 20px);

            font-weight: 500;

            letter-spacing: 4px;

            color: #ffffff;

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.75);
        }


        /* ==================================================
           ADAPTACIÓN PARA PANTALLAS PEQUEÑAS
           ================================================== */

        @media (max-width: 700px) {

            .skenzi-hero {
                min-height: 600px;
            }

            .skenzi-hero-logo {
                width: 210px;
                margin-bottom: 22px;
            }

            .skenzi-hero-frase {
                font-size: 28px;
                padding: 0 20px;
            }

            .skenzi-hero-anios {
                font-size: 13px;
                letter-spacing: 3px;
            }

        }
    /* aquí termina el CSS de la portada */


    /* ==================================================
       INTRODUCCIÓN SKENZI
       ================================================== */

    .skenzi-intro {
        ...
    }

    /* resto del CSS */


</style>
    </style>

</head>


<body>


    <!-- ==================================================
         PORTADA SKENZI
         ================================================== -->

    <section class="skenzi-hero">


        <!-- IMAGEN CON GIRO CONTINUO -->

        <div class="skenzi-hero-imagen">

            <img
                src="skenzi-nueva-identidad.png"
                alt="Nueva identidad visual de SKENZI"
            >

        </div>


        <!-- LOGO Y TEXTOS SOBRE LA IMAGEN -->

        <div class="skenzi-hero-overlay">


            <img
                src="Logotipo skenzi.png"
                alt="Logotipo SKENZI"
                class="skenzi-hero-logo"
            >


            <div class="skenzi-hero-frase">

                Una marca que creció sin perder su esencia.

            </div>


            <div class="skenzi-hero-anios">

                11 años de evolución.

            </div>


        </div>


    </section>

    <!-- ==================================================
         INTRODUCCIÓN SKENZI
         ================================================== -->

    <section class="skenzi-intro">

       

        <div class="skenzi-intro-contenido">

            <h2>
                Llevar la identidad visual al nivel de evolución de la marca.
            </h2>

            <p>
                RENAX renovó la imagen de SKENZI desde diferentes puntos de contacto,
                manteniendo su esencia y proyectándola hacia una nueva etapa.
            </p>

           

    </section>


</body>

</html>
