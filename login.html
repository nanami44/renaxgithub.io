<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - RENAX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #141414;
            padding: 25px 30px;
            border-radius: 12px;
            border: 1px solid #e74c3c;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.2);
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 22px;
        }
        p.subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }
        label {
            font-size: 13px;
            color: #ccc;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #1f1f1f;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #e74c3c;
            outline: none;
        }
        button {
            width: 100%;
            padding: 11px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        #btn-login {
            background-color: #e74c3c;
            color: #fff;
        }
        #btn-login:hover {
            background-color: #c0392b;
        }
        #btn-register {
            background-color: transparent;
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
        #btn-register:hover {
            background-color: rgba(231, 76, 60, 0.1);
        }
        #mensaje {
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>RENAX</h2>
        <p class="subtitle">Inicia sesión o regístrate para continuar</p>
        
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tucorreo@email.com" required>
        
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
        
        <button id="btn-login">Iniciar Sesión</button>
        <button id="btn-register">Registrarse</button>
        
        <p id="mensaje"></p>
    </div>

    <!-- Firebase y Lógica de Autenticación -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRXZbIC0R2ltnc_xLVhpLo49sJTIY2cxA",
            authDomain: "renax-auth.firebaseapp.com",
            projectId: "renax-auth",
            storageBucket: "renax-auth.firebasestorage.app",
            messagingSenderId: "155645649809",
            appId: "1:155645649809:web:3b203ccb729bfc8672b030"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const btnLogin = document.getElementById('btn-login');
        const btnRegister = document.getElementById('btn-register');
        const mensaje = document.getElementById('mensaje');

        // Registro de usuario
btnRegister.addEventListener('click', () => {
    const email = emailInput.value;
    const password = passwordInput.value;
 // Continuación dentro del evento btnRegister
    const nombre = document.getElementById('nombre').value;
    const apellido = document.getElementById('apellido').value;
    const ciudad = document.getElementById('ciudad').value;
    const telefono = document.getElementById('telefono').value;

    if(!email || !password || !nombre || !apellido) {
        mensaje.style.color = "#e74c3c";
        mensaje.textContent = "Por favor completa los campos obligatorios.";
        return;
    }

    createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
            const user = userCredential.user;
            
            // Actualizar el perfil con el nombre y apellido
            updateProfile(user, {
                displayName: `${nombre} ${apellido}`
            });

            // Guardar datos adicionales en localStorage
            localStorage.setItem('renax_ciudad', ciudad);
            localStorage.setItem('renax_telefono', telefono);

            // Redirigir al panel privado
            window.location.href = "dashboard.html";
        })
        .catch((error) => {
            mensaje.style.color = "#e74c3c";
            mensaje.textContent = error.message;
        });
});
        // Inicio de sesión y redirección al formulario principal
        btnLogin.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;

            if(!email || !password) {
                mensaje.style.color = "#e74c3c";
                mensaje.textContent = "Por favor completa todos los campos.";
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    mensaje.style.color = "#3498db";
                    mensaje.textContent = "¡Inicio exitoso! Redirigiendo...";
                    
                    // Redirige a tu página de formulario principal después de 1 segundo
                    setTimeout(() => {
    window.location.href = "dashboard.html";
}, 1000);
                })
                .catch((error) => {
                    mensaje.style.color = "#e74c3c";
                    mensaje.textContent = "Error: Credenciales incorrectas.";
                });
        });
    </script>
<!-- Modal de Registro (Oculto por defecto) -->
<div id="register-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background-color: #141414; border: 1px solid #e74c3c; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; box-sizing: border-box; box-shadow: 0 0 25px rgba(231, 76, 60, 0.2);">
        <h3 style="color: #fff; margin-top: 0; text-align: center; letter-spacing: 1px;">CREAR CUENTA - RENAX</h3>
        <p style="color: #aaa; font-size: 13px; text-align: center; margin-bottom: 20px;">Ingresa tus datos personales para continuar</p>
        
        <form id="form-registro-modal">
            <div style="margin-bottom: 15px;">
                <input type="text" id="reg-nombre" placeholder="Nombre" required style="width: 100%; padding: 12px; background: #0b0b0b; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 15px;">
                <input type="text" id="reg-apellido" placeholder="Apellido" required style="width: 100%; padding: 12px; background: #0b0b0b; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 15px;">
                <input type="tel" id="reg-celular" placeholder="Número Celular" required style="width: 100%; padding: 12px; background: #0b0b0b; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 15px;">
                <input type="text" id="reg-ciudad" placeholder="Ciudad o País" required style="width: 100%; padding: 12px; background: #0b0b0b; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 15px;">
                <input type="email" id="reg-email" placeholder="Correo electrónico" required style="width: 100%; padding: 12px; background: #0b0b0b; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 20px;">
                <input type="password" id="reg-password" placeholder="Contraseña" required style="width: 100%; padding: 12px; background: #0b0b0b; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box;">
            </div>
            
            <button type="submit" style="width: 100%; background-color: #e74c3c; color: #fff; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s;">Enviar y Registrarse</button>
            <button type="button" id="btn-cerrar-modal" style="width: 100%; background-color: transparent; color: #888; padding: 10px; border: none; margin-top: 10px; cursor: pointer;">Cancelar</button>
        </form>
    </div>
</div>
</body>
</html>
