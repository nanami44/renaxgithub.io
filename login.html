<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - RENAX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: #141414;
            border: 1px solid #e74c3c;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.15);
        }
        h2 {
            color: #e74c3c;
            text-align: center;
            margin-top: 0;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            background: #0b0b0b;
            border: 1px solid #333;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #e74c3c;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #c0392b;
        }
        #error-msg {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>RENAX</h2>
        <p style="text-align: center; font-size: 13px; color: #888; margin-bottom: 20px;">Ingresa a tu cuenta</p>
        
        <form id="login-form">
            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="login-email" required placeholder="tucorreo@email.com">
            </div>
            
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            
            <button type="submit">Iniciar Sesión</button>
            <div id="error-msg"></div>
        </form>

        <a href="index.html" class="back-link">← Volver al inicio</a>
    </div>

    <!-- Lógica de Firebase para Login con redirección inteligente -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRXZbIC0R2ltnc_xLVhpLo49sJTIY2cxA",
            authDomain: "renax-auth.firebaseapp.com",
            projectId: "renax-auth",
            storageBucket: "renax-auth.firebasestorage.app",
            messagingSenderId: "155645649809",
            appId: "1:155645649809:web:3b203ccb729bfc8672b030"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('login-form');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const errorMsg = document.getElementById('error-msg');

        // AQUÍ CAMBIAS ESTO por tu correo de administrador real de RENAX:
        const CORREO_ADMINISTRADOR = "admin@renax.com"; 

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = "Iniciando sesión...";

            const email = loginEmail.value.trim();
            const password = loginPassword.value.trim();

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Verificación de rol basada en el correo electrónico
                if (user.email === CORREO_ADMINISTRADOR) {
                    // Es el administrador -> Redirigir al panel de Admin
                    window.location.href = "admin.html";
                } else {
                    // Es un cliente normal -> Redirigir a su panel de usuario
                    window.location.href = "dashboard.html";
                }

            } catch (error) {
                console.error("Error de login:", error);
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMsg.textContent = "Correo o contraseña incorrectos.";
                } else {
                    errorMsg.textContent = "Ocurrió un error. Inténtalo de nuevo.";
                }
            }
        });
    </script>
</body>
</html>
