<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - RENAX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 320px;
        }
        h2 {
            text-align: center;
            color: #f39c12;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        #btn-login {
            background-color: #f39c12;
            color: #121212;
        }
        #btn-register {
            background-color: #27ae60;
            color: #fff;
        }
        button:hover {
            opacity: 0.9;
        }
        #mensaje {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>RENAX - Acceso</h2>
        <input type="email" id="email" placeholder="Correo electrónico" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        
        <button id="btn-login">Iniciar Sesión</button>
        <button id="btn-register">Registrarse</button>
        
        <p id="mensaje"></p>
    </div>

    <!-- Firebase y Lógica de Autenticación -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

        // Tu configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRXZbIC0R2ltnc_xLVhpLo49sJTIY2cxA",
            authDomain: "renax-auth.firebaseapp.com",
            projectId: "renax-auth",
            storageBucket: "renax-auth.firebasestorage.app",
            messagingSenderId: "155645649809",
            appId: "1:155645649809:web:3b203ccb729bfc8672b030"
        };

        // Inicializar Firebase y Auth
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const btnLogin = document.getElementById('btn-login');
        const btnRegister = document.getElementById('btn-register');
        const mensaje = document.getElementById('mensaje');

        // Botón de Registro
        btnRegister.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    mensaje.style.color = "#27ae60";
                    mensaje.textContent = "¡Registro exitoso! Bienvenido.";
                })
                .catch((error) => {
                    mensaje.style.color = "#e74c3c";
                    mensaje.textContent = "Error: " + error.message;
                });
        });

        // Botón de Inicio de Sesión
        btnLogin.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    mensaje.style.color = "#f39c12";
                    mensaje.textContent = "¡Inicio de sesión exitoso!";
                })
                .catch((error) => {
                    mensaje.style.color = "#e74c3c";
                    mensaje.textContent = "Error: Credenciales incorrectas.";
                });
        });
    </script>

</body>
</html>
