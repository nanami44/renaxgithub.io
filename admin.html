```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - RENAX</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: #141414;

            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        h2, h3 {
            color: #e74c3c;
            margin-top: 0;
        }

        .chat-box {
            background: #141414;
            border: 1px solid #333;

        #cliente-select {
            width: 100%;

            margin: 10px 0 20px;

        #messages-list {
            background: #0b0b0b;

        .enlace {

<body>
<div class="container">

    <div class="header">
        <h2>RENAX - Panel de Administración</h2>
        <a class="enlace" href="dashboard.html">Panel de cliente</a>
    </div>

    <div class="chat-box">
        <h3>Conversaciones con clientes</h3>

        <p style="font-size:13px;color:#aaa;">
            Selecciona un cliente para consultar sus mensajes y responderle.
        </p>

        <label for="cliente-select">Clientes registrados:</label>
        <select id="cliente-select" disabled>
            <option value="">Verificando acceso...</option>
        </select>

        <p id="estado" role="status">Verificando acceso...</p>

        <div id="messages-list" aria-live="polite">
            <span style="color:#666;text-align:center;">
                Selecciona un cliente para ver la conversación.
            </span>
        </div>

        <form id="admin-form" style="display:flex;gap:10px;">
            <input
                type="text"
                id="admin-input"
                placeholder="Escribe tu respuesta como Asesor RENAX..."
                maxlength="2000"
                required
                disabled
            >
            <button id="btn-responder" type="submit" disabled>
                Responder
            </button>
        </form>
    </div>
</div>

<script type="module">
    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        addDoc,
        query,
        orderBy,
        onSnapshot,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBRXZbIC0R2ltnc_xLVhpLo49sJTIY2cxA",
        authDomain: "renax-auth.firebaseapp.com",
        projectId: "renax-auth",
        storageBucket: "renax-auth.firebasestorage.app",
        messagingSenderId: "155645649809",
        appId: "1:155645649809:web:3b203ccb729bfc8672b030"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMINISTRADORES = [
        {
            correo: "naoco2008@gmail.com",
            uid: "3rriQaadVjT0ax84uZh5jNJrT0R2"
        },
        {
            correo: "renaxcreativit@gmail.com",
            uid: "RuBWW0PQuofpIK1uHlvY0LG1pXx1"
        }
    ];

    const selector = document.getElementById("cliente-select");
    const messagesList = document.getElementById("messages-list");
    const adminForm = document.getElementById("admin-form");
    const adminInput = document.getElementById("admin-input");
    const btnResponder = document.getElementById("btn-responder");
    const estado = document.getElementById("estado");

    let administradorAutorizado = false;
    let clienteSeleccionado = "";
    let detenerMensajes = null;
    let detenerUsuarios = null;

    function mostrarEstado(texto) {
        estado.textContent = texto;
    }

    function detenerChat() {
        if (detenerMensajes) {
            detenerMensajes();
            detenerMensajes = null;
        }
    }

    function limpiarChat(texto) {
        detenerChat();
        messagesList.replaceChildren();

        const aviso = document.createElement("span");
        aviso.style.color = "#888";
        aviso.style.textAlign = "center";
        aviso.textContent = texto;
        messagesList.appendChild(aviso);
    }

    function cargarConversacion(uid) {
        detenerChat();
        clienteSeleccionado = uid;

        adminInput.disabled = true;
        btnResponder.disabled = true;

        if (!uid) {
            limpiarChat("Selecciona un cliente para ver sus mensajes.");
            mostrarEstado("Selecciona un cliente.");
            return;
        }

        if (!administradorAutorizado) {
            limpiarChat("Acceso no autorizado.");
            return;
        }

        limpiarChat("Cargando conversación...");
        mostrarEstado("Cargando mensajes...");

        const mensajesRef = collection(
            db, "chats", uid, "mensajes"
        );

        const consulta = query(
            mensajesRef,
            orderBy("createdAt", "asc")
        );

        detenerMensajes = onSnapshot(
            consulta,
            (snapshot) => {
                messagesList.replaceChildren();

                if (snapshot.empty) {
                    limpiarChat("Todavía no hay mensajes en esta conversación.");
                } else {
                    snapshot.forEach((documento) => {
                        const data = documento.data();
                        const mensaje = document.createElement("div");

                        mensaje.className =
                            "mensaje " +
                            (data.remitente === "Asesor RENAX"
                                ? "admin"
                                : "cliente");

                        mensaje.textContent =
                            `${data.remitente || "Usuario"}: ${data.texto || ""}`;

                        messagesList.appendChild(mensaje);
                    });

                    messagesList.scrollTop = messagesList.scrollHeight;
                }

                adminInput.disabled = false;
                btnResponder.disabled = false;
                mostrarEstado("Conversación actualizada.");
            },
            (error) => {
                console.error("Error al cargar mensajes:", error);
                limpiarChat("No se pudieron cargar los mensajes.");
                mostrarEstado(
                    "Error de permisos. Revisa las reglas de Firestore."
                );
            }
        );
    }

    selector.addEventListener("change", () => {
        cargarConversacion(selector.value);
    });

    adminForm.addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const texto = adminInput.value.trim();
        const uid = clienteSeleccionado;

        if (!administradorAutorizado || !auth.currentUser) {
            mostrarEstado("Debes iniciar sesión como administrador.");
            return;
        }

        if (!uid) {
            mostrarEstado("Selecciona primero un cliente.");
            return;
        }

        if (!texto) return;

        btnResponder.disabled = true;

        try {
            const mensajesRef = collection(
                db, "chats", uid, "mensajes"
            );

            await addDoc(mensajesRef, {
                texto,
                remitente: "Asesor RENAX",
                createdAt: serverTimestamp()
            });

            adminInput.value = "";
            mostrarEstado("Respuesta enviada.");
        } catch (error) {
            console.error("Error al enviar respuesta:", error);
            mostrarEstado(
                "No se pudo enviar. Verifica los permisos de Firestore."
            );
        } finally {
            btnResponder.disabled = !clienteSeleccionado;
        }
    });

    onAuthStateChanged(auth, (user) => {
        administradorAutorizado = false;
        detenerChat();

        if (detenerUsuarios) {
            detenerUsuarios();
            detenerUsuarios = null;
        }

        selector.replaceChildren();
        selector.disabled = true;
        adminInput.disabled = true;
        btnResponder.disabled = true;
        clienteSeleccionado = "";

        if (!user) {
            window.location.replace("login.html");
            return;
        }

        const correo = (user.email || "").trim().toLowerCase();

        const autorizado = ADMINISTRADORES.some(
            admin =>
                admin.correo === correo &&
                admin.uid === user.uid
        );

        if (!autorizado) {
            window.location.replace("dashboard.html");
            return;
        }

        administradorAutorizado = true;
        mostrarEstado("Cargando clientes registrados...");

        const usuariosRef = collection(db, "usuarios");

        detenerUsuarios = onSnapshot(
            usuariosRef,
            (snapshot) => {
                const uidAnterior = selector.value;
                selector.replaceChildren();

                const opcionInicial = document.createElement("option");
                opcionInicial.value = "";
                opcionInicial.textContent = "Selecciona un cliente...";
                selector.appendChild(opcionInicial);

                const usuarios = snapshot.docs
                    .map(documento => ({
                        uid: documento.id,
                        ...documento.data()
                    }))
                    .sort((a, b) =>
                        String(a.nombre || a.email || "")
                            .localeCompare(
                                String(b.nombre || b.email || ""),
                                "es"
                            )
                    );

                usuarios.forEach((usuario) => {
                    const opcion = document.createElement("option");
                    opcion.value = usuario.uid;

                    const nombre = usuario.nombre || "Cliente";
                    const email = usuario.email || "Sin correo";

                    opcion.textContent = `${nombre} — ${email}`;
                    selector.appendChild(opcion);
                });

                selector.disabled = false;

                if (uidAnterior &&
                    usuarios.some(usuario => usuario.uid === uidAnterior)) {
                    selector.value = uidAnterior;
                } else {
                    selector.value = "";
                }

                if (selector.value) {
                    cargarConversacion(selector.value);
                } else {
                    limpiarChat("Selecciona un cliente para ver sus mensajes.");
                    mostrarEstado(
                        usuarios.length
                            ? `Clientes registrados: ${usuarios.length}.`
                            : "No se encontraron perfiles en la colección usuarios."
                    );
                }
            },
            (error) => {
                console.error("Error al cargar clientes:", error);
                mostrarEstado(
                    "No se pudo cargar la lista. Revisa los permisos de Firestore."
                );
            }
        );
    });
</script>
</body>
</html>
