<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - RENAX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            background-color: #141414;
            border: 1px solid #e74c3c;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h2 { color: #e74c3c; margin: 0; }
        .chat-box {
            background-color: #141414;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
        }
        #messages-list {
            background-color: #0b0b0b;
            border: 1px solid #333;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input, button {
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        input {
            background: #0b0b0b;
            border: 1px solid #333;
            color: #fff;
            flex: 1;
        }
        button {
            background-color: #e74c3c;
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>RENAX - Panel de Administración</h2>
            <a href="dashboard.html" style="color: #aaa; text-decoration: none; font-size: 14px;">Ir al Panel de Cliente</a>
        </div>

        <div class="chat-box">
            <h3>Conversación con el Cliente</h3>
            <p style="font-size: 13px; color: #aaa;">Aquí puedes ver y responder los mensajes enviados por el usuario actual.</p>
            
            <div id="messages-list">
                <span style="color: #666; font-size: 12px; text-align: center;">Cargando mensajes...</span>
            </div>

            <form id="admin-form" style="display: flex; gap: 10px;">
                <input type="text" id="admin-input" placeholder="Escribe tu respuesta como Asesor..." required>
                <button type="submit">Responder</button>
            </form>
        </div>
    </div>

    <!-- Lógica de Firebase para Admin -->
   
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        addDoc,
        query,
        orderBy,
        onSnapshot,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBRXZbIC0R2ltnc_xLVhpLo49sJTIY2cxA",
        authDomain: "renax-auth.firebaseapp.com",
        projectId: "renax-auth",
        storageBucket: "renax-auth.firebasestorage.app",
        messagingSenderId: "155645649809",
        appId: "1:155645649809:web:3b203ccb729bfc8672b030"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Administradores autorizados
    const ADMINISTRADORES = [
        {
            correo: "naoco2008@gmail.com",
            uid: "3rriQaadVjT0ax84uZh5jNJrT0R2"
        },
        {
            correo: "renaxcreativit@gmail.com",
            uid: "RuBWW0PQuofpIK1uHlvY0LG1pXx1"
        }
    ];

    const messagesList = document.getElementById("messages-list");
    const adminForm = document.getElementById("admin-form");
    const adminInput = document.getElementById("admin-input");

    // UID del cliente cuya conversación se mostrará
    const clienteUid = "P5dfJ7KHMKBxx1LkChDs9bBCOLI1";

    let detenerMensajes = null;
    let administradorAutorizado = false;

    function mostrarEstado(mensaje) {
        messagesList.textContent = mensaje;
    }

    onAuthStateChanged(auth, (user) => {
        if (detenerMensajes) {
            detenerMensajes();
            detenerMensajes = null;
        }

        administradorAutorizado = false;

        if (!user) {
            window.location.replace("login.html");
            return;
        }

        const correo = (user.email || "").trim().toLowerCase();

        const autorizado = ADMINISTRADORES.some(
            admin =>
                admin.correo === correo &&
                admin.uid === user.uid
        );

        if (!autorizado) {
            window.location.replace("dashboard.html");
            return;
        }

        administradorAutorizado = true;

        const mensajesRef = collection(
            db,
            "chats",
            clienteUid,
            "mensajes"
        );

        const consulta = query(
            mensajesRef,
            orderBy("createdAt", "asc")
        );

        mostrarEstado("Cargando mensajes...");

        detenerMensajes = onSnapshot(
            consulta,
            (snapshot) => {
                messagesList.replaceChildren();

                if (snapshot.empty) {
                    mostrarEstado("No hay mensajes en esta conversación.");
                    return;
                }

                snapshot.forEach((documento) => {
                    const data = documento.data();
                    const mensaje = document.createElement("div");

                    mensaje.style.padding = "8px 12px";
                    mensaje.style.borderRadius = "6px";
                    mensaje.style.maxWidth = "80%";
                    mensaje.style.fontSize = "13px";
                    mensaje.style.backgroundColor = "#1f1f1f";
                    mensaje.style.color = "#fff";

                    mensaje.textContent =
                        `${data.remitente || "Usuario"}: ${data.texto || ""}`;

                    messagesList.appendChild(mensaje);
                });

                messagesList.scrollTop = messagesList.scrollHeight;
            },
            (error) => {
                console.error("Error al cargar mensajes:", error);
                mostrarEstado(
                    "No se pudieron cargar los mensajes. Revisa los permisos de Firestore."
                );
            }
        );

        adminForm.onsubmit = async (evento) => {
            evento.preventDefault();

            if (!administradorAutorizado || !auth.currentUser) {
                mostrarEstado("Debes iniciar sesión como administrador.");
                return;
            }

            const texto = adminInput.value.trim();

            if (!texto) return;

            try {
                await addDoc(mensajesRef, {
                    texto: texto,
                    remitente: "Asesor RENAX",
                    createdAt: serverTimestamp()
                });

                adminInput.value = "";
            } catch (error) {
                console.error("Error al enviar respuesta:", error);
                alert("No se pudo enviar el mensaje. Revisa los permisos de Firestore.");
            }
        };
    });
</script>

    </script>
</body>
</html>
