<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | RENAX</title>
 <style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    box-sizing: border-box;
  }

  .registro-container {
    width: 100%;
    max-width: 650px;
    background: #0f0f0f;
    border: 2px solid #c8102e;
    border-radius: 20px;
    padding: 45px;
    box-sizing: border-box;
    box-shadow: 0 0 35px rgba(200, 16, 46, 0.25);
  }

  h1 {
    text-align: center;
    color: #ffffff;
    margin-bottom: 15px;
  }

  .registro-intro {
    text-align: center;
    color: #cccccc;
    margin-bottom: 35px;
    line-height: 1.6;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  label {
    color: #ffffff;
    font-weight: bold;
    margin-top: 10px;
  }

  input,
  select,
  textarea {
    width: 100%;
    padding: 14px;
    background: #050505;
    color: #ffffff;
    border: 1px solid #444444;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 16px;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: #c8102e;
  }

  textarea {
    resize: vertical;
  }

  button {
    margin-top: 25px;
    padding: 15px;
    background: #c8102e;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #a90000;
  }
   
/* ==========================================
   RENAX - ACCESO RESPONSIVE
   Celulares, tabletas y computadores
   ========================================== */

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
    -webkit-text-size-adjust: 100%;
}

body {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px;
    overflow-x: hidden;
}

.login-card {
    width: 100%;
    max-width: 400px;
    min-width: 0;
    margin: auto;
    padding: 30px;
    overflow-wrap: anywhere;
}

.login-card input,
.login-card button {
    max-width: 100%;
    min-width: 0;
}

.login-card input {
    min-height: 44px;
}

.login-card button {
    min-height: 44px;
    line-height: 1.4;
}

.login-card .action-link {
    min-height: 36px;
    padding: 6px 0;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.login-card .back-link {
    display: inline-block;
    padding: 6px 0;
    line-height: 1.5;
}

.login-card .msg-display {
    overflow-wrap: anywhere;
    line-height: 1.5;
}

/* TABLETAS */
@media (max-width: 768px) {
    body {
        padding: 20px;
    }

    .login-card {
        max-width: 440px;
        padding: 28px;
    }
}

/* CELULARES */
@media (max-width: 480px) {
    body {
        padding: 16px;
        align-items: center;
    }

    .login-card {
        max-width: 100%;
        padding: 24px 20px;
        border-radius: 12px;
    }

    h2 {
        font-size: 25px;
    }

    .subtitle {
        font-size: 13px;
        line-height: 1.5;
    }

    .login-card input {
        padding: 12px;
        font-size: 16px;
    }

    .login-card button {
        font-size: 14px;
    }

    .login-card .action-link,
    .login-card .back-link {
        font-size: 13px;
    }
}

/* CELULARES PEQUEÑOS */
@media (max-width: 350px) {
    body {
        padding: 10px;
    }

    .login-card {
        padding: 20px 15px;
    }

    .links-container {
        gap: 10px;
    }
}

/* ACCESIBILIDAD */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

</style> 
</head>

<body>
  <div class="registro-container">

  <h1>REGÍSTRATE EN RENAX</h1>

  <p>
    Déjanos tus datos y cuéntanos qué servicio necesitas.
    Nos pondremos en contacto contigo.
  </p>

 <form action="https://formspree.io/f/xwlpjyda" method="POST">

    <label>Nombre completo</label>
    <input type="text" name="nombre" required>

    <label>Correo electrónico</label>
    <input type="email" name="correo" required>

    <label>Número de teléfono</label>
    <input type="tel" name="telefono" required>

    <label>Empresa</label>
    <input type="text" name="empresa">

    <label>Servicio de interés</label>
    <select name="servicio" required>
      <option value="">Selecciona un servicio</option>
      <option value="diseño-marca">Diseño de marca</option>
      <option value="identidad-visual">Identidad visual</option>
      <option value="diseño-grafico">Diseño gráfico</option>
      <option value="comunicacion">Comunicación gráfica</option>
      <option value="otro">Otro</option>
    </select>

    <label>Mensaje o consulta</label>
    <textarea name="mensaje" rows="5"></textarea>

    <button type="submit">ENVIAR SOLICITUD</button>

  </form>
</div>

<script>
  const formulario = document.querySelector("form");

  formulario.addEventListener("submit", async function(event) {
    event.preventDefault();

    const datos = new FormData(formulario);

    try {
      const respuesta = await fetch(formulario.action, {
        method: "POST",
        body: datos,
        headers: {
          "Accept": "application/json"
        }
      });

      if (respuesta.ok) {
        window.location.href = "gracias.html";
      } else {
        alert("No se pudo enviar la solicitud. Por favor, inténtalo nuevamente.");
      }

    } catch (error) {
      alert("Ocurrió un error al enviar la solicitud. Por favor, inténtalo nuevamente.");
    }
  });
</script>

</body>
</html>
