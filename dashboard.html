<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Usuario - RENAX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #141414;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e74c3c;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 25px;
        }
        #user-email {
            color: #e74c3c;
            font-weight: bold;
        }
        .btn-action {
            background-color: #e74c3c;
            color: #fff;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 10px;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn-action:hover {
            background-color: #c0392b;
        }
        .btn-logout {
            background-color: transparent;
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
        .btn-logout:hover {
            background-color: rgba(231, 76, 60, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Bienvenido a RENAX</h2>
        <p>Has iniciado sesión con éxito como:<br><span id="user-email">Verificando...</span></p>
        
        <a href="contacto.html" class="btn-action">Ir al Formulario de Contacto</a>
        <button class="btn-action btn-logout" id="btn-logout">Cerrar Sesión</button>
    </div>

    <!-- Lógica de Firebase para proteger y cerrar sesión -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRXZbIC0R2ltnc_xLVhpLo49sJTIY2cxA",
            authDomain: "renax-auth.firebaseapp.com",
            projectId: "renax-auth",
            storageBucket: "renax-auth.firebasestorage.app",
            messagingSenderId: "155645649809",
            appId: "1:155645649809:web:3b203ccb729bfc8672b030"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const userEmailSpan = document.getElementById('user-email');
        const btnLogout = document.getElementById('btn-logout');

        // Seguridad: Verificar si el usuario ha iniciado sesión
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userEmailSpan.textContent = user.email;
            } else {
                // Si no está autenticado, lo devuelve al login por seguridad
                window.location.href = "login.html";
            }
        });

        // Acción para Cerrar Sesión
        btnLogout.addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            }).catch((error) => {
                console.log("Error al cerrar sesión: ", error);
            });
        });
    </script>

</body>
</html>
