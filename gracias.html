<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias | RENAX</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      box-sizing: border-box;
    }

    .gracias-container {
      width: 100%;
      max-width: 700px;
      padding: 60px 40px;
      background: #0f0f0f;
      border: 2px solid #c8102e;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 0 40px rgba(200, 16, 46, 0.25);
      box-sizing: border-box;
    }

    h1 {
      color: #ffffff;
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      color: #cccccc;
      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .btn-inicio {
      display: inline-block;
      padding: 15px 30px;
      background: #c8102e;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .btn-inicio:hover {
      background: #a90000;
      transform: scale(1.05);
    }
    
/* ==========================================
   RENAX — PÁGINA DE AGRADECIMIENTO RESPONSIVE
========================================== */

html {
    width: 100%;
    min-height: 100%;
    overflow-x: clip;
}

body {
    width: 100%;
    min-width: 0;
    min-height: 100vh;
    min-height: 100dvh;
    padding: clamp(16px, 4vw, 30px);
}

.gracias-container {
    width: 100%;
    max-width: 700px;
    padding: clamp(28px, 6vw, 60px) clamp(20px, 5vw, 40px);
    overflow-wrap: anywhere;
}

.gracias-container h1 {
    font-size: clamp(2.2rem, 7vw, 3rem);
    line-height: 1.15;
    overflow-wrap: break-word;
}

.gracias-container p {
    font-size: clamp(1rem, 2.5vw, 1.15rem);
    line-height: 1.7;
}

.btn-inicio {
    max-width: 100%;
    padding: 14px 24px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

/* TABLETAS */
@media (max-width: 768px) {
    .gracias-container {
        max-width: 600px;
        border-radius: 20px;
    }
}

/* CELULARES */
@media (max-width: 480px) {
    body {
        padding: 16px;
    }

    .gracias-container {
        padding: 32px 20px;
        border-width: 1px;
        border-radius: 16px;
        box-shadow: 0 0 25px rgba(200, 16, 46, 0.2);
    }

    .gracias-container h1 {
        font-size: 2.2rem;
        margin-top: 0;
        margin-bottom: 18px;
    }

    .gracias-container p {
        font-size: 1rem;
        line-height: 1.7;
        margin-bottom: 28px;
    }

    .btn-inicio {
        display: block;
        width: 100%;
        padding: 13px 16px;
        box-sizing: border-box;
        font-size: 13px;
    }
}

/* CELULARES PEQUEÑOS */
@media (max-width: 350px) {
    .gracias-container {
        padding: 26px 15px;
    }

    .gracias-container h1 {
        font-size: 1.9rem;
    }

    .gracias-container p {
        font-size: 0.95rem;
    }
}

/* ACCESIBILIDAD */
@media (prefers-reduced-motion: reduce) {
    .btn-inicio {
        transition: none;
    }

    .btn-inicio:hover {
        transform: none;
    }
}

  </style>
</head>

<body>

  <div class="gracias-container">

    <h1>¡GRACIAS!</h1>

    <p>
      Hemos recibido tu solicitud correctamente.
      En RENAX revisaremos tu información y nos pondremos
      en contacto contigo.
    </p>

    <a href="index.html" class="btn-inicio">
      VOLVER A INICIO
    </a>

  </div>

</body>
</html>
