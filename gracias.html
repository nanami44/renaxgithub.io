<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias | RENAX</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      box-sizing: border-box;
    }

    .gracias-container {
      width: 100%;
      max-width: 700px;
      padding: 60px 40px;
      background: #0f0f0f;
      border: 2px solid #c8102e;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 0 40px rgba(200, 16, 46, 0.25);
      box-sizing: border-box;
    }

    h1 {
      color: #ffffff;
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      color: #cccccc;
      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .btn-inicio {
      display: inline-block;
      padding: 15px 30px;
      background: #c8102e;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .btn-inicio:hover {
      background: #a90000;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="gracias-container">

    <h1>¡GRACIAS!</h1>

    <p>
      Hemos recibido tu solicitud correctamente.
      En RENAX revisaremos tu información y nos pondremos
      en contacto contigo.
    </p>

    <a href="index.html" class="btn-inicio">
      VOLVER A INICIO
    </a>

  </div>

</body>
</html>
